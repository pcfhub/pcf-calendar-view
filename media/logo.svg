<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A calendar page: two rings over the frame, a band for the month, a grid
       of days, and one day drawn as an outline where the others are solid.

       The rings are the silhouette. A framed grid of squares is the Kanban
       board's shape and the data table's; the two lugs above the frame are
       what no other mark in the catalogue has, and they are what a reader
       recognises as a calendar before they resolve a single square.

       The outlined day is the event. Every day solid is a blank page; one day
       different is a page somebody has put something on, which is what the
       control shows. An outline rather than a colour, because the mark has to
       hold in one colour on the hub's dark theme.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family
       rather than beside it.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="calendar-view-ramp" x1="6" y1="86" x2="90" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>

  <!-- The page. -->
  <rect x="6" y="18" width="84" height="68" rx="16" fill="url(#calendar-view-ramp)"/>

  <!-- The rings, over the top edge. -->
  <rect x="26" y="8" width="10" height="20" rx="5" fill="#F8FAFC"/>
  <rect x="60" y="8" width="10" height="20" rx="5" fill="#F8FAFC"/>

  <!-- The month band, as the line under it. -->
  <rect x="18" y="36" width="60" height="4" rx="2" fill="#F8FAFC"/>

  <!-- The days: two rows of four, and the third of the second row is the event. -->
  <rect x="18" y="48" width="11" height="11" rx="3" fill="#F8FAFC"/>
  <rect x="34.5" y="48" width="11" height="11" rx="3" fill="#F8FAFC"/>
  <rect x="51" y="48" width="11" height="11" rx="3" fill="#F8FAFC"/>
  <rect x="67" y="48" width="11" height="11" rx="3" fill="#F8FAFC"/>
  <rect x="18" y="65" width="11" height="11" rx="3" fill="#F8FAFC"/>
  <rect x="34.5" y="65" width="11" height="11" rx="3" fill="#F8FAFC"/>
  <rect x="52.5" y="66.5" width="8" height="8" rx="2" stroke="#F8FAFC" stroke-width="3"/>
  <rect x="67" y="65" width="11" height="11" rx="3" fill="#F8FAFC"/>
</svg>
